<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 💙</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #050816;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            margin: 10px;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.08);
        }

        .yes {
            background: #4f7cff;
            color: white;
        }

        .no {
            background: #7b4dff;
            color: white;
        }

        #countdown {
            font-size: 8rem;
            font-weight: bold;
            color: #8fb4ff;
            text-shadow: 0 0 25px #4f7cff;
        }

        #birthday {
            background: linear-gradient(135deg,
                    #050816,
                    #102040,
                    #1f3a68,
                    #4a2b78);
        }

        #birthday h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow:
                0 0 10px #4f7cff,
                0 0 25px #4f7cff,
                0 0 40px #7b4dff;
        }

        #typing {
            max-width: 700px;
            line-height: 1.8;
            font-size: 1.2rem;
            padding: 20px;
        }

        .glow {
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #4f7cff;
            }

            to {
                text-shadow:
                    0 0 20px #4f7cff,
                    0 0 40px #7b4dff;
            }
        }

        .star {
            position: absolute;
            animation: fall linear infinite;
        }

        @keyframes fall {
            from {
                transform: translateY(-100vh);
                opacity: 1;
            }

            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* CAKE */

        .cake {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .candles {
            display: flex;
            gap: 30px;
            margin-bottom: -5px;
        }

        .candle {
            width: 12px;
            height: 70px;
            background: white;
            border-radius: 20px;
            position: relative;
        }

        .flame {
            width: 18px;
            height: 25px;
            background: orange;
            border-radius: 50%;
            position: absolute;
            top: -25px;
            left: -3px;
            animation: flicker .4s infinite alternate;
            box-shadow: 0 0 15px orange;
        }

        @keyframes flicker {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.15);
            }
        }

        .cakeBody {
            width: 230px;
            height: 120px;
            border-radius: 20px;
            background: linear-gradient(45deg,
                    #4f7cff,
                    #7b4dff);
            box-shadow:
                0 0 20px rgba(79, 124, 255, .5);
        }

        h2 {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<!-- 🎵 AUDIO (مخفي) -->
<audio id="voice">
    <source src="voice.mp3" type="audio/mpeg">
</audio>
    <!-- WELCOME -->

    <div id="welcome" class="screen">

        <h2 class="glow">💙 A Special Surprise 💙</h2>

        <p>Hey Barhoumi 💜💙...</p>
        <p>I have something for u🤭  </p>

        <br>

        <p>Are you ready?</p>

        <div>
            <button class="yes" onclick="start()">YES 💜</button>
            <button class="no" onclick="nope()">NO🙂 </button>
        </div>

        <p id="answer"></p>

    </div>

    <!-- COUNTDOWN -->

    <div id="count" class="screen hidden">
        <div id="countdown">3</div>
    </div>

    <!-- CAKE -->

    <div id="cakePage" class="screen hidden">

        <h2>🎂 Make a wish first🎂</h2>

        <div class="cake">

            <div class="candles">

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

                <div class="candle">
                    <div class="flame"></div>
                </div>

            </div>

            <div class="cakeBody"></div>

        </div>

        <button class="yes" onclick="blowCandles()">
            🕯️ Blow Candles
        </button>

    </div>

    <!-- FINAL PAGE -->

    <div id="birthday" class="screen hidden">

        <h1>🎉 Happy Birthday Katkouti 🐣💙 🎉</h1>

        <p id="typing"></p>

    </div>

    <script>

        function nope() {

            document.getElementById("answer").innerHTML =
                " Try yees sanfouri🙂🙂";

        }

        function start() {

            document.getElementById("welcome")
                .classList.add("hidden");

            document.getElementById("count")
                .classList.remove("hidden");

            let n = 3;

            let timer = setInterval(() => {

                n--;

                document.getElementById("countdown")
                    .innerHTML = n;

                if (n === 0) {

                    clearInterval(timer);

                    // 🎵 تشغيل الصوت هنا بعد YES
                    document.getElementById("voice").play();

                    document.getElementById("count")
                        .classList.add("hidden");

                    document.getElementById("cakePage")
                        .classList.remove("hidden");

                }

            }, 1000);

        }

        function blowCandles() {

            let flames =
                document.querySelectorAll(".flame");

            flames.forEach((flame, index) => {

                setTimeout(() => {

                    flame.style.opacity = "0";

                }, index * 500);

            });

            setTimeout(() => {

                document.getElementById("cakePage")
                    .classList.add("hidden");

                document.getElementById("birthday")
                    .classList.remove("hidden");

                stars();
                typeText();

            }, 2500);

        }

        function stars() {

            for (let i = 0; i < 120; i++) {

                let star = document.createElement("div");

                star.innerHTML = "✨";

                star.classList.add("star");

                star.style.left = Math.random() * 100 + "vw";
                star.style.top = "-50px";

                star.style.fontSize =
                    (Math.random() * 18 + 10) + "px";

                star.style.animationDuration =
                    (Math.random() * 5 + 3) + "s";

                document.body.appendChild(star);

            }

        }

        function typeText() {

            const text = `بعرف أنك راح تحكي يكتكت راسك كي تشوف هذي 😂 بصح ما قدرتش نخلي نهارك يفوت بلا ما نعيّد عليك

يمكن ما بقيناش كيف قبل لكن تبقى شخص مميز ونتمنالك من قلبي كل الخير 💜

إن شاء الله تحقق كل اللي تتمناه وترجع لأهلك بخير وسلامة 🤲🏻💜

عيد ميلاد سعيد يا كتكوتي 🐣💙🎂`;

            let i = 0;

            let typing = setInterval(() => {

                document.getElementById("typing")
                    .innerHTML += text.charAt(i);

                i++;

                if (i >= text.length) {

                    clearInterval(typing);

                }

            }, 45);

        }

    </script>

</body>

</html>
